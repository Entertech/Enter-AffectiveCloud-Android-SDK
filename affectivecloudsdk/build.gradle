apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin:'custom.android.plugin'
apply plugin: 'kotlin-kapt'

def libraryVersion = (rootProject.ext.get("libraryVersion")) ?: "1.0.0"
println(libraryVersion)
PublishInfo {
    groupId = 'cn.entertech.android' // 库的组织，使用域名表示
    artifactId = 'affective_cloud_sdk' // 库名称
    version = '3.3.7' // 库版本
}
android {
    compileSdkVersion 32

    defaultConfig {
        multiDexEnabled true
        minSdkVersion 23
        targetSdkVersion 32
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
////
//    testOptions{
//        unitTests.returnDefaultValues = true
//    }

}
PublishInfo {
    groupId = 'cn.entertech.android' // 库的组织，使用域名表示
    artifactId = 'affective-cloud-sdk' // 库名称
    version = '1.2.4' // 库版本
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.0.0'
    api project(path: ':affective_sdk_api')
//    api 'cn.entertech.android:affective_sdk_api:1.1.6'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.0'
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation "org.java-websocket:Java-WebSocket:1.4.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.1.1"
    kapt 'com.google.auto.service:auto-service:1.0-rc6'
    implementation 'com.google.auto.service:auto-service:1.0-rc6'
    implementation ("cn.entertech.android:base:0.0.5")
}
