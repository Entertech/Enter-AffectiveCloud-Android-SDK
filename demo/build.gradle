apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

apply plugin: 'kotlin-android-extensions'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.isFile()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def signingValues = [
    'DEMO_KEYSTORE_PATH', 'DEMO_KEYSTORE_PASSWORD', 'DEMO_KEY_ALIAS', 'DEMO_KEY_PASSWORD'
].collectEntries { name ->
    [(name): System.getenv(name) ?: localProperties.getProperty(name)]
}
def missingSigningValues = signingValues.findAll { name, value -> !value?.trim() }.keySet()
def signingConfigured = missingSigningValues.isEmpty()
if (!signingConfigured && missingSigningValues.size() != signingValues.size()) {
    throw new GradleException("Missing Demo release signing settings: ${missingSigningValues.join(', ')}")
}

android {
    if (signingConfigured) {
        signingConfigs {
            config {
                keyAlias signingValues.DEMO_KEY_ALIAS
                keyPassword signingValues.DEMO_KEY_PASSWORD
                storeFile rootProject.file(signingValues.DEMO_KEYSTORE_PATH)
                storePassword signingValues.DEMO_KEYSTORE_PASSWORD
            }
        }
    }
    compileSdkVersion 28
    namespace 'cn.entertech.biomoduledemo'
    defaultConfig {
        applicationId "cn.entertech.biomoduledemo"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 9
        versionName "1.8.1"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingConfigured) {
                signingConfig signingConfigs.config
            }
        }
    }
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }

    packagingOptions {
        exclude 'META-INF/ble_release.kotlin_module'
    }

    lintOptions {
        checkReleaseBuilds false
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.0.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.0'
    implementation 'cn.entertech.android:biomoduleble:1.4.2'
    implementation 'cn.entertech.android:cushionble:1.0.0-alpha02'
    implementation 'com.orhanobut:logger:1.15'
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation "org.java-websocket:Java-WebSocket:1.4.0"
    implementation project(":affectivecloudsdk")
    implementation 'com.tencent.bugly:crashreport:latest.release'
}
