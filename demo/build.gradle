apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

android {
    signingConfigs {
        config {
            keyAlias 'entertech'
            keyPassword '123456'
            storeFile file('../entertech.jks')
            storePassword '123456'
        }
    }
    namespace 'cn.entertech.android.affective.demo'
    compileSdkVersion 32
    defaultConfig {
        applicationId "cn.entertech.biomoduledemo"
        minSdkVersion 23
        targetSdkVersion 32
        versionCode 9
        versionName "1.8.1"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
    }
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }

    packagingOptions {
        exclude 'META-INF/ble_release.kotlin_module'
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout.v113
    implementation libs.androidx.legacy.support.v4
    implementation libs.material.v100
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    implementation libs.biomoduleble
    implementation libs.gson.v2101
    implementation libs.java.websocket
//    implementation project(':affective_cloud_sdk')
    implementation project(":affective_sdk_api")
    implementation libs.crashreport
    implementation libs.affectivealgorithmlocalsdk
}
